services:
  app:
    build: .
    ports:
      - "8010:8010"
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - default_network

  postgres:
    env_file:
      - .env
    image: postgres:17
    restart: unless-stopped
    shm_size: 128mb
    networks:
      - default_network
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DATABASE: ${PG_DB}

  pgadmin:
    networks:
      - default_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin/data
    image: dpage/pgadmin4:8.14
    depends_on:
      - postgres
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

networks:
  default_network:

volumes:
  pgadmin_data:
    name: bukus_pgadmin
  db_data:
    name: bukus_db
